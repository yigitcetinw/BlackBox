name: Build BlackBox (Android)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub Actions sekmesinden manuel tetiklemeyi açar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradlew Çalıştırma İzni
      run: chmod +x gradlew

    - name: Projeyi Derle (Release APK)
      run: ./gradlew assembleRelease

    - name: Derlenen APK'yı Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: BlackBox-Release-APK
        path: app/build/outputs/apk/release/*.apk
